# yamllint disable rule:line-length
---
name: audit-dependencies
on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/deny.toml"
      - ".github/workflows/audit.yaml"
  schedule:
    # Weekly, so a new advisory against an existing dependency is noticed
    # without waiting for the next manifest edit.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install `cargo-audit`
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/492941711f3351597237bd85cd7320bb2a03040d/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-audit cargo-deny

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run `cargo audit`
        shell: bash
        run: cargo audit

      - name: Run `cargo deny`
        shell: bash
        run: cargo deny check
